<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARD ROCK PALACE - Player</title>
  <style>
    @import url('https://googleapis.com');
    
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Lexend', sans-serif !important;
      color: #b7a35a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      user-select: none;
    }

    .player-container {
      padding: 20px;
      width: 100%;
      box-sizing: border-box;
    }

    h2 {
      margin: 0 0 3px 0;
      font-size: 24px;
      letter-spacing: 1px;
      color: #b7a35a;
      font-weight: 700;
    }

    .station-sub {
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 15px;
      opacity: 0.9;
    }

    /* Grüne Song-Anzeige */
    .song-display {
      font-size: 14px;
      color: #00cc99;
      font-weight: 700;
      margin-bottom: 20px;
      height: 20px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 10px;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
    }

    .btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
      box-sizing: border-box;
    }

    .btn:hover {
      transform: scale(1.08);
    }

    #playBtn {
      background-color: #00cc99;
      border: none;
    }
    #playBtn svg {
      fill: #000000;
      width: 26px;
      height: 26px;
      margin-left: 4px;
    }

    #stopBtn {
      background-color: transparent;
      border: 2px solid #b7a359;
    }
    
    .stop-icon {
      width: 20px;
      height: 20px;
      background-color: #b7a359;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <h2>HARD ROCK PALACE</h2>
    <div class="station-sub">HRP - The place to be.</div>
    
    <!-- Das Textfeld für den Live-Songtitel -->
    <div id="currentSong" class="song-display">Verbinde mit laut.fm/hrp...</div>
    
    <div class="controls">
      <button id="playBtn" class="btn" onclick="playRadio()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="stopBtn" class="btn" onclick="stopRadio()">
        <div class="stop-icon"></div>
      </button>
    </div>
  </div>

  <audio id="audioStream" src="https://laut.fm" preload="auto"></audio>

  <script>
    var audio = document.getElementById('audioStream');
    var apiUrl = "https://laut.fm";

    function playRadio() {
      audio.play().catch(function(error) {
        console.log("Fehler beim Abspielen:", error);
      });
    }

    function stopRadio() {
      audio.pause();
      audio.src = "";
      audio.src = "https://laut.fm";
      audio.load();
    }

    // Holt den aktuellen Songtitel direkt aus Ihrem laut.fm-Datenstrom
    function updateSongInfo() {
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data && data.title) {
            var artistName = data.artist ? data.artist : "HARD ROCK PALACE";
            document.getElementById('currentSong').innerText = artistName + " - " + data.title;
          } else {
            document.getElementById('currentSong').innerText = "Live Stream aktiv";
          }
        })
        .catch(error => {
          document.getElementById('currentSong').innerText = "HARD ROCK PALACE on air!";
        });
    }

    // Sofort beim Laden ausführen und alle 10 Sekunden wiederholen
    updateSongInfo();
    setInterval(updateSongInfo, 10000);
  </script>
</body>
</html>
