<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HARD ROCK PALACE - Player</title>
  <style>
    @import url('https://googleapis.com');
    
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
      font-family: 'Lexend', sans-serif !important;
      color: #b7a35a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: auto; 
      min-height: 100vh;
      text-align: center;
      user-select: none;
    }

     .player-container {
      padding: 10px 15px; 
      width: 100%;
      box-sizing: border-box;
    }

    .logo-container {
      width: 100%;
      max-width: 330px; 
      margin: 9px auto 1px auto; /* Logo um exakt 3px nach oben gesetzt */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .station-sub {
      font-size: 13px;
      color: #ffffff;
      margin-bottom: 20px; /* Songtitel um exakt 3px nach oben geholt */
      opacity: 0.9;
      max-width: 330px;
      margin-left: auto;
      margin-right: auto;
      text-align: left; 
      padding-left: 100px; 
      box-sizing: border-box;
    }

     .song-display {
      font-size: 14px;
      color: #00cc99;
      font-weight: 700;
      margin-bottom: 20px; 
      height: 24px; 
      line-height: 24px; /* Verhindert das Abschneiden der Schrift oben/unten */
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 0 10px;
      box-sizing: border-box;
    }

     .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin-bottom: 8px; /* Holt powered by deutlich weiter nach oben */
    }

    .btn {
      width: 44px; /* Buttons kompakter gestaltet */
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s;
      box-sizing: border-box;
    }

    .btn:hover {
      transform: scale(1.08);
    }

    #playBtn {
      background-color: #00cc99;
      border: none;
    }
    #playBtn svg {
      fill: #000000;
      width: 24px; /* Wuchtiges, großes Play-Dreieck bleibt erhalten */
      height: 24px;
      margin-left: 3px;
    }

    #stopBtn {
      background-color: transparent;
      border: 2px solid #00cc99;
    }
    
    .stop-icon {
      width: 13px;
      height: 13px;
      background-color: #00cc99;
      border-radius: 2px;
    }

    .powered-by {
      font-size: 11px;
      color: #ffffff;
      opacity: 0.9;
      margin-top: -5px;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <!-- Das Logo-Bild -->
    <div class="logo-container">
      <img src="https://i.ibb.co/jvJLP8xF/Hard-Rock-Palace-playerlogo.png" alt="HARD ROCK PALACE" class="logo-img">
    </div>
    
    <div class="station-sub">HRP - The place to be.</div>
    
      <!-- Hier wird das Lied live in Grün angezeigt -->
    <div id="currentSong" class="song-display">Verbinde mit api.laut.fm/station/hrp/current_song</div>
    
    <div class="controls">
      <button id="playBtn" class="btn" onclick="playRadio()">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="stopBtn" class="btn" onclick="stopRadio()">
        <div class="stop-icon"></div>
      </button>
    </div>

    <div class="powered-by">powered by laut.fm</div>
  </div>
    
    <!-- DIESE ZEILE HIER WIEDER EINFÜGEN -->
    <div class="powered-by">powered by laut.fm</div>
  </div>

  <!-- Nativer Audio-Baustein OHNE blockierende Zusatzbefehle -->
  <audio id="audioStream"></audio>

  <script>

     
    var audio = document.getElementById('audioStream');
    
    // HIER steht nun bombenfest Ihre korrekte Audio-Leitung!
    var streamUrl = "https://stream.laut.fm/hrp";
    
    // Die offizielle Datenschnittstelle für den Songtext
    var apiUrl = "https://api.laut.fm/station/hrp/current_song";

    function playRadio() {
      // Lädt den Stream absolut frisch bei jedem Klick
      audio.src = streamUrl;
      audio.load();
      
      var playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.then(function() {
          console.log("Stream erfolgreich gestartet.");
        }).catch(function(error) {
          console.log("Browser blockiert automatisches Abspielen:", error);
        });
      }
    }

    function stopRadio() {
      audio.pause();
      audio.src = ""; // Kappt die Datenleitung vollständig
    }

    function updateSongInfo() {
      fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
          if (data && data.title) {
            var artistName = (data.artist && data.artist.name) ? data.artist.name : "HARD ROCK PALACE";
            document.getElementById('currentSong').innerText = artistName + " - " + data.title;
          } else {
            document.getElementById('currentSong').innerText = "Live Stream aktiv";
          }
        })
        .catch(error => {
          document.getElementById('currentSong').innerText = "HARD ROCK PALACE on air!";
        });
    }

    updateSongInfo();
    setInterval(updateSongInfo, 10000);
  </script>

<script>
(function() {
    var channel = new BroadcastChannel('hrp_player_channel');
    channel.postMessage('new_instance_opened');
    
    channel.onmessage = function(event) {
        if (event.data === 'new_instance_opened') {
            channel.postMessage('close_yourself');
            window.focus(); 
        }
        if (event.data === 'close_yourself') {
            window.close();
        }
    };
})();
</script>


</body>
</html>
